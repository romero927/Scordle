server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz files made at build time; compress anything else on the fly.
    gzip_static on;
    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript image/svg+xml image/x-icon;
    gzip_vary on;

    # Vite puts a content hash in asset file names, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons rarely change; let browsers keep them for a week.
    location /img/ {
        add_header Cache-Control "public, max-age=604800";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
