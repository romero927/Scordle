app = "kgromero-scordle"
primary_region = "ewr"

[env]
PORT = "8000"

[http_service]
auto_start_machines = true
auto_stop_machines = true
force_https = true
internal_port = 8_000
min_machines_running = 0
processes = [ "app" ]

[[http_service.checks]]
method = "GET"
path = "/"
interval = "30s"
timeout = "5s"
grace_period = "5s"

# nginx serving static files needs very little memory (the Django app used 1gb).
[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "256mb"
